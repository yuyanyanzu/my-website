<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>胡政的学习笔记</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部：站名 + 一句话说明 -->
  <header class="site-header">
    <h1>胡政的学习笔记</h1>
    <p class="site-slogan">一个零基础学习者的 30 天建站记录，每天学什么，这里都能看到。</p>
  </header>

  <main class="container">
    <!-- 标签栏：点击筛选（F3 / AC-4） -->
    <nav id="tag-bar" class="tag-bar" aria-label="标签筛选">
      <!-- 标签按钮由 app.js 根据笔记数据动态生成 -->
    </nav>

    <!-- 笔记列表：按日期倒序的卡片（F1 / AC-1、AC-2） -->
    <section id="note-list" class="note-list" aria-label="笔记列表">
      <!-- 卡片由 app.js 动态生成 -->
    </section>

    <!-- 空状态：筛选无结果时显示（F3 / AC-7） -->
    <div id="empty-state" class="empty-state" hidden>
      <p>这个标签下还没有笔记，点击「全部」返回完整列表。</p>
    </div>

    <!-- 加载提示：笔记还没拉取完时显示 -->
    <div id="loading" class="loading">
      <p>笔记加载中……</p>
    </div>
  </main>

  <!-- 关于区块（F4 / AC-5）：自我介绍 + 学习目标 + GitHub 链接 -->
  <footer class="about">
    <h2>关于这个站</h2>
    <p>我是胡政，一个从零开始学做网站的人。这个站本身就是我的学习成果——用纯 HTML/CSS/JS 搭建，笔记用 Markdown 写、用 Git 提交发布。</p>
    <p><strong>学习目标：</strong>30 天内独立完成一个能公开访问的学习笔记站，并把过程全部记录下来。</p>
    <p><a href="https://github.com/yuyanyanzu/my-website" target="_blank" rel="noopener">GitHub 仓库 →</a></p>
  </footer>

  <!-- marked.js：把 Markdown 渲染成 HTML 的成熟小库（技术选型见 TECH_DESIGN.md 第 3 节） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
