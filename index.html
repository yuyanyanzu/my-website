<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的第一个网站</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
      color: #333;
    }
    .card {
      text-align: center;
      padding: 48px 64px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 4px 0; color: #666; }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #e8f0fe;
      color: #1a73e8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 网站搭建中</h1>
    <p>这是我的第一个 GitHub 仓库占位页。</p>
    <p>MVP 功能将于 Day 7 上线。</p>
    <span class="badge">Day 2 · 仓库初始化完成</span>
  </div>
</body>
</html>
